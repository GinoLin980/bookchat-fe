<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Chat - Register</title>
    <link rel="stylesheet" href="BookChat.css">
    <script src="BookChat.js" async></script>
</head>
<body>
    <header>
        Book Chat!
    </header>
    <div class="page-content">
        <h1>
            Register Here
        </h1>
        <form 
            id="registerForm"
            onsubmit="register(this.username.value, this.password.value)">
            <div class="form-group">
                <label for="username">
                    Username:
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required>
            </div>
            <div class="form-group">
                <label for="password">
                    Password:
                </label>
                <input
                    type="text"
                    id="password"
                    name="password"
                    required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">
                    Confirm Password:
                </label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    required>
            </div>
            <button
                type="submit"
                class="basic-button">
                Register
            </button>
        </form>
        <button
            class="back-button"
            onclick="location.href='MainMenu.html'">
            Back to Main Menu
        </button>
    </div>
</body>
</html>
