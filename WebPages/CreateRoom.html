<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Chat - Create Room</title>
    <link rel="stylesheet" href="BookChat.css">
    <!-- defer: both run in order after the HTML is parsed.
         BookChat.js first so its functions exist when CreateRoom.js runs. -->
    <script src="BookChat.js" defer></script>
    <script src="CreateRoom.js" defer></script>
</head>
<body>
    <!--This is the create a Room page-->
    <header>
        Book Chat!
    </header>
    <div class="page-content">
        <h1>
            Create a Room Here
        </h1>
            <!--This is the create a Room form, takes the inputs
            that are needed to create a new room-->

        <form id="createRoomForm">
            <div class="form-group">
                <label for="roomTitle">
                    Room Title:
                </label>
                <input
                    type="text"
                    id="roomTitle"
                    name="roomTitle"
                    required>
            </div>
            <div class="form-group">
                <label for="bookTitle">
                    Book Title:
                </label>
                <input
                    type="text"
                    id="bookTitle"
                    name="bookTitle"
                    required>
            </div>
            <div class="form-group">
                <label for="bookAuthor">
                    Book Author:
                </label>
                <input
                    type="text"
                    id="bookAuthor"
                    name="bookAuthor"
                    required>
            </div>
            <div class="form-group">
                <label for="discussionDate">
                    Discussion Date:
                </label>
                <input
                    type="date"
                    id="discussionDate"
                    name="discussionDate"
                    required>
            </div>
            <div class="form-group">
                <label for="discussionTime">
                    Discussion Time:
                </label>
                <input
                    type="time"
                    id="discussionTime"
                    name="discussionTime"
                    required>
            </div>
            <!-- Success/error messages show here -->
            <p id="formMessage" aria-live="polite"></p>
            <button
                type="submit"
                class="basic-button">
                Create Room
            </button>
        </form>
        <button
            class="back-button"
            onclick="location.href='MainMenu.html'">
            Back to Main Menu
        </button>
    </div>
</body>
</html>
