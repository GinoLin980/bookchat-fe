<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Chat - Create Room</title>
    <link rel="stylesheet" href="BookChat.css">
    <script src="BookChat.js" async></script>
</head>
<body>
    <header>
        Book Chat!
    </header>
    <div class="page-content">
        <h1>
            Create a Room Here
        </h1>
        <form
            id=""createRoomForm"
            onsubmit="TODO:placeholder">
            <div class="form-group">
                <label for="roomTitle">
                    Room Title:
                </label>
                <input
                    type="text"
                    id="roomTitle"
                    name="roomTitle"
                    required>
            </div>
            <div class="form-group">
                <label for="bookTitle">
                    Book Title:
                </label>
                <input
                    type="text"
                    id="bookTitle"
                    name="bookTitle"
                    required>
            </div>
            <div class="form-group">
                <label for="bookAuthor">
                    Book Author:
                </label>
                <input
                    type="text"
                    id="bookAuthor"
                    name="bookAuthor"
                    required>
            </div>
            <div class="form-group">
                <label for="dicussionDate">
                    Discussion Date:
                </label>
                <input
                    type="date"
                    id="discussionDate"
                    name="discussionDate"
                    required>
            </div>
            <div class="form-group">
                <label for="discussionTime">
                    Discussion Time:
                </label>
                <input
                    type="time"
                    id="discussionTime"
                    name="discussionTime"
                    required>
            </div>
            <button
                type="submit"
                class="basic-button">
                Create Room
            </button>
        </form>
        <button
            class="back-button"
            onclick="location.href='MainMenu.html'">
            Back to Main Menu
        </button>
    </div>
</body>
</html>
