<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Chat - Room</title>
    <link rel="stylesheet" href="BookChat.css">
    <script src="BookChat.js" defer></script>
    <script src="Room.js" defer></script>
</head>
<body>
    <header>
        Book Chat!
    </header>
    <!--This is the page for being in a room-->
    <div class="page-content">
        <h1>
            Discuss Your Book Here
        </h1>
        <!-- Room.js fills this in from GET /rooms/:id.
             It also adds the Manage Room button (moderator only) with the
             room id in the link: ManageRoom.html?id=<roomId>.
             Don't put a Manage Room button here: a static one has no id,
             so ManageRoom.js would send you to JoinRoom.html. -->
        <div id="roomInfo" class="room-info">
            <p>Loading room...</p>
        </div>
        <div class="current-turn">
            Current Turn:
            <span id="currentTurn">
                Loading...
            </span>
        </div>
        <!-- Room.js sets this message from the participation state:
            Not logged in:      must log in to participate + [login button]
            No permission:      no permission yet + permission request form
            Pending:            request sent, waiting for moderator approval
            Waiting:            has permission, waiting for a turn (comment box disabled)
            My turn:            comment box enabled, Post Comment / Pass Turn work
            Moderator:          can comment at any time
            Ended:              discussion over, no one can comment
             -->
        <div class="participation-status">
            <h2>Your Participation Status</h2>
            <p id="participationStatus">
                Loading...
            </p>
        </div>
        <h2>Discussion</h2>
        <!-- Room.js places the comments here -->
        <div id="comments">
            <p>Loading comments...</p>
        </div>
        <!-- Hidden until Room.js knows the user is approved or the moderator -->
        <div id="commentArea" class="comment-area" hidden>
            <form id="commentForm">
                <div class="form-group">
                    <label for="commentText">
                        Comment:
                    </label>
                    <textarea
                        id="commentText"
                        name="commentText"
                        rows="5"
                        placeholder="You can comment when it is your turn"
                        disabled></textarea>
                </div>
                <button
                    type="submit"
                    id="postButton"
                    class="basic-button"
                    disabled>
                    Post Comment
                </button>
                <button
                    type="button"
                    id="passButton"
                    class="basic-button"
                    disabled>
                    Pass Turn
                </button>
            </form>
        </div>
        <!-- Hidden until Room.js knows the user can request permission -->
        <div class="permission-request" hidden>
            <h2>Participate in Discussion</h2>
            <p>
                You must have read this book to participate in the discussion.
            </p>
            <form id="permissionForm">
                <div class="form-group">
                    <label>
                        <input
                            type="checkbox"
                            id="readBook"
                            name="readBook">
                        I have read this book
                    </label>
                </div>
                <button
                    type="submit"
                    class="basic-button">
                    Request Permission to Comment
                </button>
            </form>
        </div>
        <button
            type="button"
            class="back-button"
            onclick="location.href='MainMenu.html'">
            Back to Main Menu
        </button>
    </div>
</body>
</html>
