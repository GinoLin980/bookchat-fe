<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Chat - Login</title>
    <link rel="stylesheet" href="BookChat.css">
    <script type="module" src="login.js"></script>
</head>
<body>
    <header>
        Book Chat!
    </header>
    <div class="page-content">
        <h1>
            Login Here
        </h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">
                    Username:
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required>
            </div>
            <div class="form-group">
                <label for="password">
                    Password:
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required>
            </div>
            <p id="loginError" role="alert" hidden></p>
            <button
                type="submit"
                class="basic-button">
                Login
            </button>
        </form>
        <button
            class="back-button"
            onclick="location.href='MainMenu.html'">
            Back to Main Menu
        </button>
    </div>
</body>
</html>
